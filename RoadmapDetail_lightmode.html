  <script>

    // Data definition for 15 checkpoints across 3 levels (7 cards max per level)

    const roadmapData = [

      // LEVEL 1 (Days 1 to 7)

      { day: 1, title: "Web Fundamentals & First Servlet", desc: "Understand core web protocols (HTTP/HTTPS), request-response lifecycle, and build your very first Java Servlet.", level: "Level 1" },

      { day: 2, title: "Sessions & MVC Architecture", desc: "Master HTTP sessions, cookies, servlet context, and introduce Model-View-Controller design patterns.", level: "Level 1" },

      { day: 3, title: "JDBC & MySQL CRUD", desc: "Connect your Java applications to relational databases using JDBC. Perform Create, Read, Update, and Delete operations securely.", level: "Level 1" },

      { day: 4, title: "Spring Boot Fundamentals", desc: "Dive into Spring IoC container, Dependency Injection, annotations, and auto-configuration in Spring Boot.", level: "Level 1" },

      { day: 5, title: "REST APIs & Hibernate", desc: "Design robust RESTful endpoints, handle JSON payloads, and map database entities using Hibernate ORM.", level: "Level 1" },

      { day: 6, title: "JWT Authentication", desc: "Implement stateless token-based authentication and secure endpoints with Spring Security and JSON Web Tokens.", level: "Level 1" },

      { day: 7, title: "Level 1 Capstone Project", desc: "Build and deploy a fully functional backend API integrating database persistence, security, and REST architecture.", level: "Level 1" },

      // LEVEL 2 (Days 8 to 14)

      { day: 8, title: "Advanced Microservices Architecture", desc: "Break monoliths into scalable microservices. Learn service discovery, API gateways, and inter-service communication.", level: "Level 2" },

      { day: 9, title: "Spring Cloud & Config Server", desc: "Centralize configuration management and implement resilient fault tolerance with Resilience4j circuit breakers.", level: "Level 2" },

      { day: 10, title: "Docker Containerization", desc: "Containerize your Spring Boot services, write Dockerfiles, and manage multi-container environments with Docker Compose.", level: "Level 2" },

      { day: 11, title: "Kubernetes Orchestration", desc: "Deploy, scale, and manage containerized microservices clusters using Kubernetes pods, deployments, and services.", level: "Level 2" },

      { day: 12, title: "CI/CD Pipelines with GitHub Actions", desc: "Automate build, test, and deployment workflows with continuous integration and continuous deployment pipelines.", level: "Level 2" },

      { day: 13, title: "Message Queues & Kafka", desc: "Implement event-driven architectures using Apache Kafka for asynchronous communication and event streaming.", level: "Level 2" },

      { day: 14, title: "Level 2 Cloud Deployment Project", desc: "Deploy a distributed microservices ecosystem onto cloud infrastructure with automated CI/CD and monitoring.", level: "Level 2" },

      // LEVEL 3 (Day 15)

      { day: 15, title: "System Design & Enterprise Architecture", desc: "Master large-scale distributed system design, caching strategies, load balancing, database sharding, and enterprise readiness.", level: "Level 3" }

    ];

    const container = document.getElementById('roadmap-container');

    const currentLevelText = document.getElementById('current-level-text');

    // Mobile Menu toggle function

    function toggleSidebar() {

      const sidebar = document.getElementById('sidebar');

      const isOpen = sidebar.classList.contains('opacity-100');

      if (isOpen) {

        sidebar.classList.remove('opacity-100', 'pointer-events-auto');

        sidebar.classList.add('opacity-0', 'pointer-events-none');

      } else {

        sidebar.classList.remove('opacity-0', 'pointer-events-none');

        sidebar.classList.add('opacity-100', 'pointer-events-auto');

      }

    }

    // Render Roadmap Cards with plain level section titles inserted before each level group

    function renderRoadmap() {

      const svg = document.getElementById('roadmap-svg');

      container.innerHTML = '';

      container.appendChild(svg);

      roadmapData.forEach((item, index) => {

        const isCurrent = (item.day === 3); // Day 3 highlighted as current active day

        // Insert Level text checkpoint at the start of each level group

        if (index === 0 || roadmapData[index - 1].level !== item.level) {

          const levelHeader = document.createElement('div');

          levelHeader.className = `w-full text-left font-pixel text-xs sm:text-sm text-[#002D93] tracking-widest pl-4 sm:pl-12 my-4 z-10`;

          levelHeader.innerText = item.level.toUpperCase();

          container.appendChild(levelHeader);

        }

        let alignmentClass = '';

        if (index % 3 === 0) {

          alignmentClass = 'self-start ml-2 sm:ml-10';

        } else if (index % 3 === 1) {

          alignmentClass = 'self-center mx-auto';

        } else {

          alignmentClass = 'self-end mr-2 sm:mr-10';

        }

        const card = document.createElement('div');

        card.className = `w-[68%] max-w-[240px] sm:max-w-md transition-all duration-300 cursor-pointer z-10 ${alignmentClass}`;

        card.dataset.day = String(item.day);
        card.dataset.level = item.level;
        card.onclick = () => openModal(item);

        if (isCurrent) {

          card.innerHTML = `

            <div class="bg-[#002D93] text-white p-3 sm:p-5 rounded-xl shadow-xl border-2 border-blue-400 flex items-center justify-between transform hover:scale-105 transition">

              <div>

                <div class="flex items-center space-x-2 mb-1">

                  <span class="text-[8px] sm:text-[10px] font-bold uppercase tracking-wider bg-white/20 px-2 py-0.5 rounded text-white">DAY ${item.day}</span>

                  <span class="text-[7px] sm:text-[9px] bg-green-400 text-[#0A192F] font-bold px-1.5 py-0.5 rounded">ACTIVE</span>

                </div>

                <h4 class="text-xs sm:text-base font-bold">${item.title}</h4>

              </div>

              <svg class="w-4 h-4 sm:w-5 sm:h-5 text-white flex-shrink-0 ml-2 sm:ml-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>

            </div>

          `;

        } else {

          card.innerHTML = `

            <div class="bg-white hover:bg-blue-50/80 text-[#002D93] p-3 sm:p-5 rounded-xl shadow-md border border-blue-100 flex items-center justify-between transform hover:scale-105 transition">

              <div>

                <span class="text-[8px] sm:text-[10px] font-bold uppercase tracking-wider text-blue-600 block mb-1">DAY ${item.day}</span>

                <h4 class="text-xs sm:text-base font-bold">${item.title}</h4>

              </div>

              <svg class="w-4 h-4 sm:w-5 sm:h-5 text-[#002D93] flex-shrink-0 ml-2 sm:ml-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>

            </div>

          `;

        }

        container.appendChild(card);
      });

      requestAnimationFrame(() => requestAnimationFrame(updateRoadmapPaths));
    }

    // Draw a separate curve for each level from the first card to the last card.
    function updateRoadmapPaths() {
      const svg = document.getElementById('roadmap-svg');
      if (!svg || !container) return;

      const containerRect = container.getBoundingClientRect();
      const width = container.clientWidth;
      const height = container.scrollHeight;
      if (!width || !height) return;

      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.setAttribute('width', String(width));
      svg.setAttribute('height', String(height));
      svg.style.width = `${width}px`;
      svg.style.height = `${height}px`;
      svg.replaceChildren();

      const levels = [...new Set(roadmapData.map(item => item.level))];
      levels.forEach(level => {
        const cards = [...container.querySelectorAll('[data-day][data-level]')]
          .filter(card => card.dataset.level === level)
          .sort((a, b) => Number(a.dataset.day) - Number(b.dataset.day));
        if (cards.length < 2) return;

        const points = cards.map(card => {
          const rect = card.getBoundingClientRect();
          return {
            x: rect.left - containerRect.left + rect.width / 2,
            y: rect.top - containerRect.top + rect.height / 2
          };
        });

        let d = `M ${points[0].x} ${points[0].y}`;
        for (let i = 1; i < points.length; i++) {
          const previous = points[i - 1];
          const current = points[i];
          const middleY = (previous.y + current.y) / 2;
          d += ` C ${previous.x} ${middleY}, ${current.x} ${middleY}, ${current.x} ${current.y}`;
        }

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', '#529eff');
        path.setAttribute('stroke-width', '4');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        path.setAttribute('stroke-dasharray', '10 6');
        path.dataset.level = level;
        svg.appendChild(path);
      });
    }

    // Modal Control Functions

    function openModal(item) {

      document.getElementById('modal-day').innerText = `DAY ${item.day}`;

      document.getElementById('modal-title').innerText = item.title;

      document.getElementById('modal-desc').innerText = item.desc;

      document.getElementById('modal-level').innerText = item.level;

      document.getElementById('detail-modal').classList.remove('hidden');

    }

    function closeModal() {

      document.getElementById('detail-modal').classList.add('hidden');

    }

    // Dynamic Scroll Listener to update the Level Indicator card cleanly based on current view section

    window.addEventListener('scroll', () => {

      const scrollPosition = window.scrollY + window.innerHeight / 2;

      const containerRect = container.getBoundingClientRect();

      const containerTop = containerRect.top + window.scrollY;

      const containerHeight = containerRect.height;

      const relativeScroll = scrollPosition - containerTop;

      const progressRatio = Math.max(0, Math.min(1, relativeScroll / containerHeight));

      let currentLevel = "Level 1";

      if (progressRatio > 0.88) {

        currentLevel = "Level 3";

      } else if (progressRatio > 0.45) {

        currentLevel = "Level 2";

      } else {

        currentLevel = "Level 1";

      }

      currentLevelText.innerText = currentLevel;

    });

    window.addEventListener('load', renderRoadmap);
    window.addEventListener('resize', () => requestAnimationFrame(updateRoadmapPaths));
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => requestAnimationFrame(updateRoadmapPaths));
    }
    if ('ResizeObserver' in window) {
      const roadmapResizeObserver = new ResizeObserver(() => requestAnimationFrame(updateRoadmapPaths));
      roadmapResizeObserver.observe(container);
    }

    const userMenu = document.getElementById('userMenu');

const trigger = document.getElementById('userMenuTrigger');

const dropdown = document.getElementById('userDropdown');

function setDropdown(open) {

  trigger.setAttribute('aria-expanded', String(open));

  dropdown.hidden = !open;

}

trigger.addEventListener('click', () => {

  setDropdown(trigger.getAttribute('aria-expanded') !== 'true');

});

document.addEventListener('click', (event) => {

  if (!userMenu.contains(event.target)) setDropdown(false);

});

document.addEventListener('keydown', (event) => {

  if (event.key === 'Escape') {

    setDropdown(false);

    trigger.focus();

  }

});

// Connect this to your authentication provider.

document.getElementById('signOutButton').addEventListener('click', () => {

  console.log('Connect your sign-out function here.');

});

  </script>
